// Top-level build file where you can add configuration options common to all
// sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath 'com.diffplug.spotless:spotless-plugin-gradle:8.6.0'
    }
}

// Android Gradle Plugin connected tests uninstall the target package during cleanup. That
// destroys its private data, so a user phone must never be selected accidentally.
gradle.taskGraph.whenReady { graph ->
    def runsConnectedAndroidTests = graph.allTasks.any {
        it.name.startsWith('connected') && it.name.endsWith('AndroidTest')
    }
    if (!runsConnectedAndroidTests) {
        return
    }
    def serial = System.getenv('ANDROID_SERIAL') ?: ''
    def emulator = serial.startsWith('emulator-')
    def disposablePhysicalDevice =
            providers.gradleProperty('allowDisposableConnectedTests')
                    .map { it.toBoolean() }
                    .getOrElse(false)
    if (serial.isBlank()) {
        throw new GradleException(
                'ANDROID_SERIAL is required for connected tests. Use an emulator or the safe '
                        + 'tools/run-connected-tests.ps1 wrapper.')
    }
    if (!emulator && !disposablePhysicalDevice) {
        throw new GradleException(
                "Refusing connected tests on physical device ${serial}: AGP uninstalls the "
                        + 'target app and deletes its private data. Use a disposable device and '
                        + '-PallowDisposableConnectedTests=true only after explicit approval.')
    }
}

apply plugin: 'com.android.application'
apply plugin: 'com.diffplug.spotless'

repositories {
    google()
    mavenCentral()
    maven { url='https://jitpack.io'}
}

configurations {
    playstoreImplementation
    freeImplementation
    conversationsFreeImplementation
    conversationsPlaystorImplementation
    conversationsPlaystoreImplementation
    quicksyPlaystoreImplementation
    quicksyPlaystoreImplementation
    quicksyFreeImplementation
    quicksyImplementation
}

spotless {
    // Format every file changed by this fork while leaving the imported Conversations history
    // untouched. This commit is the documented Maer Chat upstream baseline.
    ratchetFrom '9fdc9ed5b2e2e4981cf58fce871c2ed47623c2bc'
    java {
        target '**/*.java'
        googleJavaFormat().aosp().reflowLongStrings()
    }
}


dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    annotationProcessor 'org.immutables:value:2.12.2'
    implementation 'org.immutables:value-annotations:2.12.2'
    annotationProcessor project(':libs:annotation-processor')
    implementation project(':libs:annotation')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.concurrent:concurrent-futures:1.3.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.emoji2:emoji2:1.6.0'
    freeImplementation 'androidx.emoji2:emoji2-bundled:1.6.0'
    implementation 'androidx.emoji2:emoji2-emojipicker:1.6.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.heifwriter:heifwriter:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.sharetarget:sharetarget:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.viewpager:viewpager:1.1.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'com.github.open-keychain.open-keychain:openpgp-api:v5.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.guava:guava:33.6.0-android'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.leinardi.android:speed-dial:3.3.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.vanniktech:android-image-cropper:4.7.0'
    implementation 'im.conversations.webrtc:webrtc-android:129.0.0'
    implementation 'io.deepmedia.community:transcoder-android:0.11.2'
    implementation 'me.leolin:ShortcutBadger:1.1.22@aar'
    //noinspection NewerVersionAvailable
    implementation 'net.fellbaum:jemoji:1.7.6' //1.7.6 is the latest with Java 8 support
    implementation 'org.bouncycastle:bcmail-jdk18on:1.84'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.hsluv:hsluv:1.0'
    implementation 'org.jxmpp:jxmpp-jid:1.1.0'
    implementation 'org.jxmpp:jxmpp-stringprep-libidn:1.1.0'
    implementation 'org.minidns:minidns-client:1.1.1'
    implementation 'org.minidns:minidns-dnssec:1.1.1'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'org.whispersystems:signal-protocol-java:2.6.2'
    conversationsPlaystoreImplementation 'com.android.installreferrer:installreferrer:2.2'
    quicksyImplementation 'io.michaelrocks:libphonenumber-android:9.0.31'

    quicksyPlaystoreImplementation 'com.google.android.gms:play-services-auth-api-phone:18.3.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'

}

ext {
    preDexEnabled = System.getProperty("pre-dex", "true")
    abiCodes = ['armeabi-v7a': 1, 'x86': 2, 'x86_64': 3, 'arm64-v8a': 4]
}

android {
    namespace 'eu.siacs.conversations'
    compileSdk = 37

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 37
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 8
        versionName "0.5.3"
        applicationId "fr.maer.chat"
        resValue "string", "applicationId", applicationId
        def appName = "Maer Chat"
        resValue "string", "app_name", appName
        resValue "string", "default_xmpp_domain", "xmpp.maer.fr"
        buildConfigField "String", "APP_NAME", "\"$appName\""
        buildConfigField "String", "DEFAULT_XMPP_DOMAIN", "\"xmpp.maer.fr\""
        base {
            archivesName = "${android.defaultConfig.applicationId}-${android.defaultConfig.versionName}"
        }
    }

    splits {
        abi {
            universalApk true
            enable true
            reset()
            //noinspection ChromeOsAbiSupport
            include project.ext.abiCodes.keySet() as String[]
        }
    }

    configurations {
        implementation.exclude group: 'org.jetbrains' , module:'annotations'
    }

    dataBinding {
        enabled true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    flavorDimensions += "mode"
    flavorDimensions += "distribution"

    productFlavors {

        quicksy {
            dimension "mode"
            applicationId = "im.quicksy.client"
            resValue "string", "applicationId", applicationId

            def appName = "Quicksy"
            resValue "string", "app_name", appName
            buildConfigField "String", "APP_NAME", "\"$appName\""
            buildConfigField "String", "PRIVACY_POLICY", "\"https://quicksy.im/privacy.htm\""
            def propsFile = rootProject.file('quicksy-auth-secret.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                def key = props.getProperty('QUICKSY_AUTHENTICATION_SECRET')
                if (key != null) {
                    buildConfigField "String", "QUICKSY_AUTHENTICATION_SECRET",  "\"${key}\""
                } else {
                    buildConfigField "String", "QUICKSY_AUTHENTICATION_SECRET", "null"
                }
            } else {
                buildConfigField "String", "QUICKSY_AUTHENTICATION_SECRET", "null"
            }
        }

        conversations {
            dimension "mode"
            buildConfigField "String", "PRIVACY_POLICY", "null"
        }

        playstore {
            dimension "distribution"
            versionNameSuffix "+playstore"
        }
        free {
            dimension "distribution"
            versionNameSuffix "+free"
        }
    }

    // Maer Chat is shipped only as the Conversations/free flavor. The upstream Quicksy and
    // Play Store variants require unrelated identities and private push-service resources.
    variantFilter { variant ->
        def flavorNames = variant.flavors*.name
        if (!(flavorNames.contains('conversations') && flavorNames.contains('free'))) {
            variant.ignore = true
        }
    }

    sourceSets {
        conversationsFree {
            java {
                srcDir 'src/conversationsFree/java'
            }
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    if (new File("signing.properties").exists()) {
        Properties props = new Properties()
        props.load(new FileInputStream(file("signing.properties")))

        signingConfigs {
            release {
                storeFile file(props['keystore'])
                storePassword props['keystore.password']
                keyAlias props['keystore.alias']
                keyPassword props['keystore.password']
            }
        }
        buildTypes.release.signingConfig = signingConfigs.release
    }


    subprojects {

        afterEvaluate {
            if (getPlugins().hasPlugin('android') ||
                    getPlugins().hasPlugin('android-library')) {

                configure(android.lintOptions) {
                    disable 'AndroidGradlePluginVersion', 'MissingTranslation'
                }
            }

        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/BCKEY.DSA', 'META-INF/BCKEY.SF', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
    lint {
        // Conversations carries longstanding lint findings across its large compatibility
        // surface. Keep that debt explicit so CI fails only on findings introduced by Maer Chat.
        baseline = file("lint-baseline.xml")
        warningsAsErrors true
        // Dependency upgrades are reviewed deliberately; a newly published AGP must not
        // turn an otherwise reproducible release red without a compatibility review.
        disable 'AndroidGradlePluginVersion', 'MissingTranslation', 'InvalidPackage', 'AppCompatResource'
    }
    buildFeatures {
        buildConfig true
        resValues = true
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            def baseAbiVersionCode = project.ext.abiCodes.get(output.getFilter(com.android.build.OutputFile.ABI))
            if (baseAbiVersionCode != null) {
                output.versionCodeOverride = (100 * project.android.defaultConfig.versionCode) + baseAbiVersionCode
            } else {
                output.versionCodeOverride = 100 * project.android.defaultConfig.versionCode
            }
        }

    }
}
